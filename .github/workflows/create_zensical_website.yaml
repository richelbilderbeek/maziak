# Adapted from https://zensical.org/docs/publish-your-site/#with-github-actions
name: Create Zensical website


on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/create_zensical_website.yaml
      - .github/workflows/build_wasm.yaml
      - 'docs/**'
      - zensical.toml
      - '*.cpp'
      - '*.h'
      - '*.pri'
      - '*.pro'
      - '*.qrc'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # The game, built for WebAssembly, to be played on the 'Play' page
  build_wasm:
    uses: ./.github/workflows/build_wasm.yaml

  create_zensical_website:
    needs: build_wasm
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: pip install zensical
      - run: zensical build --clean --strict
      - uses: actions/download-artifact@v4
        with:
          name: maziak_wasm
          path: site/game
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
