# Build the Qt version of the game on Windows,
# creating a Windows executable as a workflow artifact
name: Build on Windows

on:
  push:
  pull_request:

jobs:
  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Use MinGW (GCC), as the project uses GCC compiler flags
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_mingw'
          tools: 'tools_mingw1310'
          cache: true

      - name: Build
        shell: cmd
        run: |
          mkdir build
          cd build
          qmake ..\MaziakDesktopQt.pro
          mingw32-make -j4 release

      - name: Collect the executable and the Qt libraries it needs
        shell: cmd
        run: |
          mkdir maziak
          copy build\release\MaziakDesktopQt.exe maziak\
          copy LICENSE maziak\
          windeployqt --release --no-translations maziak\MaziakDesktopQt.exe

      - uses: actions/upload-artifact@v4
        with:
          name: maziak_windows
          path: maziak
