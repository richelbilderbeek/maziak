# Build the Qt version of the game on Windows,
# creating a Windows executable as a workflow artifact
name: Build on Windows

on:
  push:
  pull_request:

jobs:
  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Clone dependencies
        run: git clone https://github.com/richelbilderbeek/RibiClasses ../RibiClasses

      - name: Build
        shell: cmd
        run: |
          mkdir build
          cd build
          qmake ..\MaziakDesktopQt.pro
          nmake release

      - name: Collect the executable and the Qt libraries it needs
        shell: cmd
        run: |
          mkdir maziak
          copy build\release\MaziakDesktopQt.exe maziak\
          copy LICENSE maziak\
          windeployqt --release --no-translations maziak\MaziakDesktopQt.exe

      - uses: actions/upload-artifact@v4
        with:
          name: maziak_windows
          path: maziak
